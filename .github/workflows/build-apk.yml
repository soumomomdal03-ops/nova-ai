
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Nova AI Project ZIP
        shell: bash
        run: |
          ZIP_FILE="NovaAI-GitHub-Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: NovaAI-GitHub-Ready.zip not found!"
            ls -la
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/nova-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/nova-project"

          if [ ! -f "$RUNNER_TEMP/nova-project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found after extraction"
            find "$RUNNER_TEMP/nova-project" -maxdepth 4 -type f
            exit 1
          fi

          echo "Nova AI project extracted successfully."

      - name: Build Nova AI Debug APK
        shell: bash
        run: |
          gradle \
            -p "$RUNNER_TEMP/nova-project" \
            --no-daemon \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: ${{ runner.temp }}/nova-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
