
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: Android Gradle project not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          DIR="${FILE%/*}"
          if [ "$DIR" = "$FILE" ]; then DIR="."; fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project: $DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          DIR="${{ steps.project.outputs.dir }}"

          if [ -f "$DIR/gradlew" ]; then
            chmod +x "$DIR/gradlew"
            "$DIR/gradlew" -p "$DIR" --no-daemon :app:assembleDebug
          else
            gradle -p "$DIR" --no-daemon :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
